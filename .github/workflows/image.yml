# Future release workflow: publication requires an explicitly authorized tag.
# Umbrel no puede usar imágenes construidas en local: las descarga de un registro.
name: Imagen Agent RC

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versiones
        id: v
        run: |
          app="${GITHUB_REF_NAME#v}"
          APP_VERSION="$app" node -e 'const v=process.env.APP_VERSION;if(!/^\d+\.\d+\.\d+$/.test(v))process.exit(1);const [a,b]=v.split(".").map(Number);if(a===0&&b<2)process.exit(1)'
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "claude=$(cat CLAUDE_VERSION)" >> "$GITHUB_OUTPUT"
          echo "codex=$(cat CODEX_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.app }}
          tags: ghcr.io/logiqdadmin/claude-rc:${{ steps.v.outputs.app }}
          labels: |
            org.opencontainers.image.source=https://github.com/LogiQDAdmin/claude-rc
            org.opencontainers.image.version=${{ steps.v.outputs.app }}
            io.logiqd.claude-version=${{ steps.v.outputs.claude }}
            io.logiqd.codex-version=${{ steps.v.outputs.codex }}
            org.opencontainers.image.description=Agent RC para Claude Code y Codex con versiones fijadas
