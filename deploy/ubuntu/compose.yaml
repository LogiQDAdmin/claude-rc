# Despliegue en Ubuntu (pc-compute). Copia de referencia: el stack vivo está en /opt/stacks/claude-rc.
# El panel escucha sólo en 127.0.0.1: entrar con `ssh -L 7681:127.0.0.1:7681 pc` → http://localhost:7681
name: claude-rc

services:
  claude-rc:
    image: ghcr.io/logiqd/claude-rc:0.1.0
    container_name: claude-rc
    environment:
      TZ: Europe/Madrid
      RC_NAME_PREFIX: proto
      PROJECT_ROOTS: /projects,/data/proyectos
    ports:
      - "127.0.0.1:7681:8080"
    volumes:
      - /srv/appdata/claude-rc/data:/data
      - /srv/appdata/claude-rc/projects:/projects
    # Tiempo para que cada servidor reciba Ctrl+C y cierre limpio (si no, cuenta como apagón)
    stop_grace_period: 45s
    mem_limit: 4g
    restart: unless-stopped
