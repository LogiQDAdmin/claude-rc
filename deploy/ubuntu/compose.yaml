# Example deployment after publication approval. Keep the existing app identity
# and attach the existing /data volume explicitly; never copy credentials.
name: claude-rc

services:
  claude-rc:
    image: ghcr.io/logiqdadmin/claude-rc:0.2.0
    container_name: claude-rc
    environment:
      TZ: Europe/Madrid
      RC_NAME_PREFIX: rc
      PROJECT_ROOTS: /projects,/data/proyectos
    ports:
      - "127.0.0.1:3781:8080"
    volumes:
      - "${AGENT_RC_DATA:?Select the existing app data directory}:/data"
      - "${AGENT_RC_PROJECTS:?Select the project directory}:/projects"
    # Tiempo para que cada servidor reciba Ctrl+C y cierre limpio (si no, cuenta como apagón)
    stop_grace_period: 60s
    mem_limit: 4g
    restart: unless-stopped
