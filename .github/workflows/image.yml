# Construye la imagen y la publica en ghcr.io/logiqdadmin/claude-rc al crear una etiqueta vX.Y.Z.
# Umbrel no puede usar imágenes construidas en local: las descarga de un registro.
name: Imagen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versiones
        id: v
        run: |
          echo "app=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "claude=$(cat CLAUDE_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            CLAUDE_VERSION=${{ steps.v.outputs.claude }}
            APP_VERSION=${{ steps.v.outputs.app }}
          tags: ghcr.io/logiqdadmin/claude-rc:${{ steps.v.outputs.app }}
          labels: |
            org.opencontainers.image.source=https://github.com/LogiQDAdmin/claude-rc
            org.opencontainers.image.description=Gestor de Claude Remote Control para Ubuntu y Umbrel
